<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div class="test">Hello!</div>
  <div class="projects">
    <div class="project">
      <div class="project-name">
        Default
      </div>
      <div class="project-details" data-id="123">
        This is the default project.
      </div>
      <div class="task-list">
        <div class="task">
          <div class="name">Task</div>
          <div class="date">2/22</div>
          <div class="details">This is a task.</div>
          <div class="notes"></div> <!-- where to put notes? -->
        </div>
        <div class="task">
          <div class="name">Task 2</div>
          <div class="date">2/22</div>
          <div class="details">This is another task.</div>
          <div class="notes">Hello. I'm a task. Nice to meet you!</div>
        </div>
        <div class="task" data-id="456">
          <div class="name">Task Checklist</div>
          <div class="date">2/22</div>
          <div class="details">This is a task checklist</div>
          <div class="notes">Hello. I'm a task. Nice to meet you!</div> 
          <div class="checklist">
            <div class="checklist-item">Item 1</div>
            <div class="checklist-item">Item 2</div>
            <div class="checklist-item">Item 3</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
