<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div class="todo-list" id="todo">
    <div class="projects" id="projects">
      <div class="add-project">
        <button class="add-project-button">+</button>
      </div>
    </div>
  </div>

  </div>
  <!-- Templates -->
  <template id="project-card-template">
    <div class="project">
      <div class="name"></div>
      <div class="details"></div>
      <div class="edit-project-buttons">
        <button class="add-task-button">Add a task</button>
        <button class="edit-project-button">Edit</button>
        <button class="save-project-button hidden">Save</button>
        <button class="delete-project-button hidden">Delete</button>
      </div>
      <div class="task-list">
      </div>
    </div>
  </template>
  <template id="task-card-template">
    <div class="task priority-low" data-id="">
      <button class="expand-collapse">-</button>
      <div class="name"></div>
      <div class="date-time">
          <input class="date-input" type="date">
          <div class="date"></div>
          <input class="time-input" type="time">
          <div class="time"></div>
      </div>
      <div class="details"></div>
      <div class="collapsible hidden">
          <hr class="border">
          <div class="notes"></div>
          <div class="edit-buttons">
              <button class="delete-button">Delete</button>
              <button class="edit-button">Edit</button>
              <button class="complete-button">Complete</button>
          </div>
      </div>
    </div>
  </template>
  <template id="edit-task-card-template">
    <div class="edit-task">
      <div class="name" contenteditable="true"></div>
      <div class="date-time">
          <input class="date-input" type="date">
          <div class="date"></div>
          <input class="time-input" type="time">
          <div class="time"></div>
      </div>
      <div class="details" contenteditable="true"></div>
      <hr class="border">
      <div class="make-checklist">
        <div>Checklist</div>
        <input class="checklist-checkbox" type="checkbox">
      </div>
      <div class="notes" contenteditable="true"></div>
      <div class="priority">
          <label for="priority-select">Priority</label>
          <select name="priority" id="priority-select">
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
          </select>
      </div>
      <div class="finish-buttons">
          <button class="confirm-button">Confirm</button>
          <button class="cancel-button">Cancel</button>
      </div>
    </div>
  </template>
  <template id="checklist-template">
    <div class="checklist">
      <div class="checklist-item">
        <input class="item-checkbox" type="checkbox">
        <div class="item-content"></div>
      </div>
      <button class="add-checklist-item">+</button>
    </div>
  </template>
  <template id="edit-checklist-template">
    <div class="checklist">
      <div class="checklist-item">
        <button class="item-delete">X</button>
        <div class="item-content" contenteditable="true"></div>
      </div>
      <button class="add-checklist-item">+</button>
    </div>
  </template>
</body>
</html>
