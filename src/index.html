<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div class="projects" id="projects">
    <div class="project" id="default">
      <div class="project-name">
        Default
      </div>
      <div class="project-details">
        This is the default project.
      </div>
      <div class="new-task-button">
        <button>Add a task</button>
      </div>
      <div class="task-list" id="1">
        <div class="edit-task" data-id="789">
          <div contenteditable="true" class="name"></div>
          <div class="date-time">
            <input class="date-input" type="date">
            <div class="date">2/22</div>
            <input class="time-input" type="time">
            <div class="time">3:30</div>
          </div>
          <div contenteditable="true" class="details"></div>
          <hr>
          <div contenteditable="true" class="notes"></div> 
          <div class="finish-buttons">
            <button class="confirm">Confirm</button>
            <button class="cancel">Cancel</button>
          </div>
        </div>
        <div class="task" data-id="789">
          <div class="name">Task Checklist</div>
          <div class="date">2/22</div>
          <div class="details">This is a task checklist</div>
          <div class="notes">Hello. I'm a task. Nice to meet you!</div> 
          <div class="checklist">
            <div class="checklist-item">Item 1</div>
            <div class="checklist-item">Item 2</div>
            <div class="checklist-item">Item 3</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
